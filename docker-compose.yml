services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sitewatch
      POSTGRES_PASSWORD: sitewatch
      POSTGRES_DB: sitewatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitewatch"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
